<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบประเมินประสิทธิภาพการปฏิบัติงาน</title>
    
    <!-- นำเข้า React และ ReactDOM แบบ CDN -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    
    <!-- นำเข้า Babel สำหรับแปลงโค้ด JSX ให้ทำงานบนเบราว์เซอร์ -->
    <script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
    
    <!-- นำเข้า Tailwind CSS สำหรับความสวยงาม -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- นำเข้า docx สำหรับส่งออกไฟล์ Word -->
    <script src="https://unpkg.com/docx@8.5.0/build/index.umd.js"></script>

    <!-- ฟอนต์สำหรับหน้าจอ (ใบพิมพ์ยังใช้ TH Sarabun ตามเดิม) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&family=Sarabun:wght@300;400;500;600;700&display=swap">

    <style>
        /* สไตล์พิเศษสำหรับการสั่งพิมพ์กระดาษให้ออกมาเป็น A4 สมบูรณ์แบบ */
        @media print {
            .print\:hidden { display: none !important; }
            body { background: white; margin: 0; padding: 0; }
            @page { size: A4; margin: 8mm; } /* ตั้งระยะขอบกระดาษ A4 ให้กระชับเพื่อไม่เกิน 2 แผ่น */
            
            /* ลบเงาและปรับขนาดกล่องให้เต็ม 100% ในหน้าพิมพ์ */
            .max-w-\[210mm\] { 
                max-width: 100% !important; 
                width: 100% !important; 
                margin: 0 !important; 
                box-shadow: none !important; 
                min-height: auto !important;
            }
            .print\:p-0 { padding: 0 !important; }
            
            /* การจัดการตารางและหน้ากระดาษ */
            table { page-break-inside: auto; }
            tr    { page-break-inside: avoid; page-break-after: auto; }
            thead { display: table-header-group; } /* ให้หัวตารางโผล่ทุกหน้าถ้าเนื้อหายาว */
            
            /* ป้องกันการถูกตัดขาดกลางหน้ากระดาษ (เช่น ลายเซ็นถูกตัดครึ่ง) */
            .break-inside-avoid { 
                page-break-inside: avoid; 
                break-inside: avoid; 
            }
        }
        /* กำหนดฟอนต์หลักเป็น TH Sarabun PSK ตามหลักสารบรรณ (ชื่อฟอนต์ที่ติดตั้งจริงคือ TH SarabunPSK) */
        body { font-family: 'TH SarabunPSK', 'TH Sarabun PSK', 'Sarabun', sans-serif; }

        :root {
            --ui-bg: #f2f5fb;
            --ui-ink: #0f1c33;
            --ui-ink-soft: #3b4a63;
            --ui-muted: #66758c;
            --ui-line: #e1e7f1;
            --ui-line-strong: #cfd8e6;
            --ui-surface: #ffffff;
            --ui-navy: #0a1428;
            --ui-navy-2: #101f3d;
            --ui-blue: #2563eb;
            --ui-cyan: #06b6d4;
            --ui-tint: #eef4ff;
            --ui-red: #e11d48;
            --ui-gradient: linear-gradient(120deg, #2563eb, #06b6d4);
            --ui-shadow-sm: 0 1px 2px rgba(15,28,51,0.05), 0 1px 1px rgba(15,28,51,0.03);
            --ui-shadow-md: 0 1px 2px rgba(15,28,51,0.06), 0 12px 28px -14px rgba(15,28,51,0.18);
            --ui-shadow-lg: 0 2px 4px rgba(15,28,51,0.06), 0 28px 56px -24px rgba(15,28,51,0.32);
            --ui-radius: 16px;
            --ui-radius-sm: 10px;
        }

        @media screen {
            body.modern-ui {
                font-family: 'IBM Plex Sans Thai', 'Sarabun', system-ui, sans-serif;
                background: var(--ui-bg);
                color: var(--ui-ink);
                -webkit-font-smoothing: antialiased;
            }

            /* แสงออโรราจาง ๆ ด้านหลังเนื้อหา */
            body.modern-ui::before {
                content: "";
                position: fixed;
                inset: 0;
                pointer-events: none;
                z-index: 0;
                background:
                    radial-gradient(720px 360px at 88% -8%, rgba(6,182,212,0.13), transparent 70%),
                    radial-gradient(620px 340px at 30% -12%, rgba(37,99,235,0.11), transparent 70%);
            }

            body.modern-ui #root {
                position: relative;
                z-index: 1;
                min-height: 100vh;
            }

            body.modern-ui .app-shell,
            body.modern-ui .app-content {
                background: transparent;
                color: var(--ui-ink);
            }

            body.modern-ui .app-content {
                padding: 28px;
                scrollbar-gutter: stable;
            }

            body.modern-ui :focus-visible {
                outline: 2px solid var(--ui-blue);
                outline-offset: 2px;
            }

            /* แบรนด์ */
            body.modern-ui .brand-mark {
                display: inline-flex;
                flex-shrink: 0;
                align-items: center;
                justify-content: center;
                width: 40px;
                height: 40px;
                border-radius: 12px;
                color: #fff;
                background: var(--ui-gradient);
                box-shadow: 0 8px 20px -8px rgba(6,182,212,0.8), inset 0 1px 0 rgba(255,255,255,0.3);
            }

            body.modern-ui .brand-mark-lg {
                width: 60px;
                height: 60px;
                border-radius: 18px;
            }

            /* แถบข้าง */
            body.modern-ui .admin-sidebar {
                background:
                    radial-gradient(320px 240px at 0% 0%, rgba(6,182,212,0.2), transparent 70%),
                    linear-gradient(180deg, var(--ui-navy-2), var(--ui-navy));
                border-right: 1px solid rgba(255,255,255,0.06);
            }

            body.modern-ui .admin-sidebar nav button {
                color: #c4d0e4;
                border: 1px solid transparent;
            }

            body.modern-ui .admin-sidebar nav button:hover {
                background: rgba(255,255,255,0.06);
                color: #fff;
            }

            body.modern-ui .admin-sidebar nav button.bg-blue-600 {
                background: rgba(56,139,253,0.16);
                border-color: rgba(103,232,249,0.28);
                color: #fff;
                box-shadow: inset 2px 0 0 #22d3ee;
            }

            body.modern-ui .sidebar-foot {
                margin: 16px;
                padding: 14px;
                border-radius: 12px;
                font-size: 12px;
                line-height: 1.55;
                color: #8fa0bb;
                background: rgba(255,255,255,0.04);
                border: 1px solid rgba(255,255,255,0.07);
            }

            /* แถบบน */
            body.modern-ui .app-header {
                background: rgba(255,255,255,0.78);
                border-bottom: 1px solid var(--ui-line);
                box-shadow: none;
                backdrop-filter: blur(14px) saturate(1.3);
            }

            body.modern-ui .app-header h2 {
                color: var(--ui-ink);
            }

            body.modern-ui .app-subtitle {
                margin-top: 1px;
                font-size: 12px;
                color: var(--ui-muted);
            }

            body.modern-ui .app-header button {
                font-size: 14px;
                color: var(--ui-ink-soft);
                background: var(--ui-surface);
                border: 1px solid var(--ui-line-strong);
                border-radius: var(--ui-radius-sm);
                padding: 8px 14px;
            }

            body.modern-ui .app-header button:hover {
                background: var(--ui-tint);
                color: var(--ui-blue);
            }

            /* ปุ่มและช่องกรอก */
            body.modern-ui button {
                border-radius: var(--ui-radius-sm);
                transition: background-color 160ms ease, border-color 160ms ease, color 160ms ease, box-shadow 160ms ease, transform 160ms ease;
            }

            body.modern-ui button:active:not(:disabled) {
                transform: translateY(1px);
            }

            body.modern-ui input,
            body.modern-ui select,
            body.modern-ui textarea {
                background-color: var(--ui-surface);
                border: 1px solid var(--ui-line-strong);
                border-radius: var(--ui-radius-sm);
                color: var(--ui-ink);
                transition: border-color 160ms ease, box-shadow 160ms ease;
            }

            body.modern-ui input:focus,
            body.modern-ui select:focus,
            body.modern-ui textarea:focus {
                outline: none;
                border-color: var(--ui-blue);
                box-shadow: 0 0 0 4px rgba(37,99,235,0.13);
            }

            body.modern-ui input:disabled {
                background-color: #f1f4f9;
                color: var(--ui-muted);
            }

            body.modern-ui button.bg-blue-600 {
                background: var(--ui-gradient);
                border: 0;
                color: #fff;
                box-shadow: 0 10px 22px -10px rgba(37,99,235,0.75);
            }

            body.modern-ui button.bg-blue-600:hover {
                box-shadow: 0 14px 26px -10px rgba(37,99,235,0.9);
                filter: brightness(1.06);
            }

            body.modern-ui .dashboard-toolbar button.bg-slate-800 {
                background: var(--ui-surface);
                color: var(--ui-ink);
                border: 1px solid var(--ui-line-strong);
                box-shadow: var(--ui-shadow-sm);
                font-size: 14px;
            }

            body.modern-ui .dashboard-toolbar button.bg-slate-800:hover {
                background: var(--ui-tint);
                border-color: rgba(37,99,235,0.45);
                color: var(--ui-blue);
            }

            /* ส่วนหัวแดชบอร์ด */
            body.modern-ui .dash-hero {
                position: relative;
                overflow: hidden;
                border-radius: 20px;
                color: #fff;
                background:
                    radial-gradient(520px 260px at 92% 0%, rgba(6,182,212,0.42), transparent 70%),
                    radial-gradient(460px 260px at 45% 120%, rgba(37,99,235,0.5), transparent 70%),
                    linear-gradient(120deg, var(--ui-navy), var(--ui-navy-2));
                box-shadow: var(--ui-shadow-lg);
            }

            body.modern-ui .dash-hero-body {
                position: relative;
                display: flex;
                flex-wrap: wrap;
                align-items: center;
                justify-content: space-between;
                gap: 20px;
                padding: 30px 32px;
            }

            body.modern-ui .hero-eyebrow {
                display: inline-flex;
                align-items: center;
                gap: 8px;
                font-size: 12.5px;
                font-weight: 500;
                color: #a5f3fc;
            }

            body.modern-ui .hero-eyebrow::before {
                content: "";
                width: 7px;
                height: 7px;
                border-radius: 50%;
                background: #22d3ee;
                box-shadow: 0 0 0 4px rgba(34,211,238,0.2);
            }

            body.modern-ui .hero-title {
                margin-top: 8px;
                font-size: 28px;
                font-weight: 600;
                line-height: 1.25;
            }

            body.modern-ui .hero-text {
                margin-top: 6px;
                max-width: 560px;
                font-size: 14px;
                line-height: 1.65;
                color: #b9c7dd;
            }

            body.modern-ui .hero-cta {
                display: inline-flex;
                align-items: center;
                gap: 8px;
                padding: 12px 20px;
                font-weight: 600;
                color: var(--ui-navy);
                background: #fff;
                box-shadow: 0 12px 28px -12px rgba(34,211,238,0.9);
            }

            body.modern-ui .hero-cta:hover {
                background: #e6fbff;
            }

            body.modern-ui .hero-ecg {
                position: absolute;
                left: 0;
                right: 0;
                bottom: 6px;
                width: 100%;
                height: 96px;
                fill: none;
                pointer-events: none;
                -webkit-mask-image: linear-gradient(to right, transparent 42%, #000 62%);
                mask-image: linear-gradient(to right, transparent 42%, #000 62%);
            }

            body.modern-ui .hero-ecg path {
                stroke-linecap: round;
                stroke-linejoin: round;
                vector-effect: non-scaling-stroke;
            }

            body.modern-ui .hero-ecg-base {
                stroke: rgba(103,232,249,0.14);
                stroke-width: 1.5;
            }

            body.modern-ui .hero-ecg-pulse {
                stroke: #67e8f9;
                stroke-width: 2;
                stroke-dasharray: 130 870;
                filter: drop-shadow(0 0 6px rgba(103,232,249,0.85));
                animation: ui-ecg 5.5s linear infinite;
            }

            /* การ์ดตัวเลข */
            body.modern-ui .stat-card {
                position: relative;
                background: var(--ui-surface);
                border: 1px solid var(--ui-line);
                border-radius: var(--ui-radius);
                padding: 20px;
                box-shadow: var(--ui-shadow-sm);
            }

            body.modern-ui .stat-card:hover {
                box-shadow: var(--ui-shadow-md);
                transform: none;
            }

            body.modern-ui .stat-card.border-blue-500 {
                border-color: var(--ui-blue);
                box-shadow: 0 0 0 3px rgba(37,99,235,0.12), var(--ui-shadow-md);
            }

            body.modern-ui .stat-card > .bg-slate-50 {
                background: var(--ui-tint);
                border-radius: 12px;
                padding: 10px;
            }

            body.modern-ui .stat-card > .bg-slate-50 svg {
                width: 24px;
                height: 24px;
                color: var(--ui-blue);
            }

            body.modern-ui .stat-card .text-sm {
                font-size: 13px;
                color: var(--ui-muted);
            }

            body.modern-ui .stat-value {
                font-size: 28px;
                font-weight: 600;
                line-height: 1.25;
                color: var(--ui-ink);
                font-variant-numeric: tabular-nums;
            }

            body.modern-ui .meter {
                display: block;
                width: 100%;
                height: 5px;
                border-radius: 99px;
                overflow: hidden;
                background: #e6ebf4;
            }

            body.modern-ui .meter > i {
                display: block;
                height: 100%;
                border-radius: inherit;
                background: var(--ui-gradient);
                transition: width 400ms ease;
            }

            /* แถบเครื่องมือ */
            body.modern-ui .dashboard-toolbar {
                background: var(--ui-surface);
                border: 1px solid var(--ui-line);
                border-radius: var(--ui-radius);
                box-shadow: var(--ui-shadow-sm);
            }

            body.modern-ui .dashboard-toolbar p {
                color: var(--ui-muted);
            }

            body.modern-ui .dashboard-toolbar > div:empty {
                display: none;
            }

            body.modern-ui .period-tabs {
                display: inline-flex;
                gap: 2px;
                padding: 3px;
                border-radius: 12px;
                background: #e9eef6;
            }

            body.modern-ui .period-tab {
                padding: 6px 14px;
                font-size: 14px;
                font-weight: 500;
                white-space: nowrap;
                color: var(--ui-ink-soft);
            }

            body.modern-ui .period-tab:hover {
                color: var(--ui-ink);
            }

            body.modern-ui .period-tab.is-active {
                background: var(--ui-surface);
                color: var(--ui-blue);
                box-shadow: var(--ui-shadow-sm);
            }

            /* ตารางแยกรอบ */
            body.modern-ui .period-heading {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 12px;
            }

            body.modern-ui .period-heading-title {
                display: inline-flex;
                flex-wrap: wrap;
                align-items: center;
                gap: 10px;
                font-size: 17px;
                font-weight: 600;
                color: var(--ui-ink);
            }

            body.modern-ui .period-heading-bar {
                width: 4px;
                height: 18px;
                border-radius: 4px;
                background: var(--ui-gradient);
            }

            body.modern-ui .period-heading-range,
            body.modern-ui .period-heading-count {
                font-size: 13px;
                font-weight: 400;
                color: var(--ui-muted);
                white-space: nowrap;
            }

            body.modern-ui .data-panel {
                background: var(--ui-surface);
                border: 1px solid var(--ui-line);
                border-radius: var(--ui-radius);
                box-shadow: var(--ui-shadow-sm);
                overflow-x: auto;
                overflow-y: hidden;
            }

            /* ความกว้างคอลัมน์คงที่ เพื่อให้ตารางครั้งที่ 1 และ 2 ตรงกัน */
            body.modern-ui .data-panel table {
                table-layout: fixed;
            }

            body.modern-ui .data-panel table.is-admin th:nth-child(1) { width: 5%; }
            body.modern-ui .data-panel table.is-admin th:nth-child(2) { width: 18%; }
            body.modern-ui .data-panel table.is-admin th:nth-child(3) { width: 11%; }
            body.modern-ui .data-panel table.is-admin th:nth-child(4) { width: 12%; }
            body.modern-ui .data-panel table.is-admin th:nth-child(5) { width: 7.5%; }
            body.modern-ui .data-panel table.is-admin th:nth-child(6) { width: 10%; }
            body.modern-ui .data-panel table.is-admin th:nth-child(7) { width: 10.5%; }
            body.modern-ui .data-panel table.is-admin th:nth-child(8) { width: 9%; }
            body.modern-ui .data-panel table.is-admin th:nth-child(9) { width: 17%; }

            body.modern-ui .data-panel table.is-public th:nth-child(1) { width: 26%; }
            body.modern-ui .data-panel table.is-public th:nth-child(2) { width: 16%; }
            body.modern-ui .data-panel table.is-public th:nth-child(3) { width: 22%; }
            body.modern-ui .data-panel table.is-public th:nth-child(4) { width: 10%; }
            body.modern-ui .data-panel table.is-public th:nth-child(5) { width: 11%; }
            body.modern-ui .data-panel table.is-public th:nth-child(6) { width: 15%; }

            body.modern-ui .data-panel thead {
                background: #f7f9fc;
                border-color: var(--ui-line);
            }

            body.modern-ui .data-panel th {
                padding: 12px;
                font-size: 12.5px;
                font-weight: 600;
                color: var(--ui-muted);
            }

            body.modern-ui .data-panel td {
                padding: 12px;
                font-size: 14px;
                overflow-wrap: anywhere;
            }

            body.modern-ui .data-panel td:last-child > .flex {
                gap: 2px;
            }

            body.modern-ui .data-panel tbody {
                border-color: var(--ui-line);
            }

            body.modern-ui .data-panel tbody tr {
                transition: background-color 140ms ease;
            }

            body.modern-ui .data-panel tbody tr:hover {
                background: #f5f8fe;
            }

            body.modern-ui .person-cell {
                display: flex;
                align-items: center;
                gap: 10px;
                min-width: 0;
            }

            body.modern-ui .person-name {
                min-width: 0;
                line-height: 1.4;
            }

            /* ชื่อ-สกุลตัดบรรทัดที่ช่องว่างระหว่างคำเท่านั้น ไม่ตัดกลางนามสกุล */
            body.modern-ui .person-name-part {
                white-space: nowrap;
            }

            body.modern-ui .data-panel td[data-label="วันที่ประเมิน"],
            body.modern-ui .data-panel th {
                white-space: nowrap;
            }

            body.modern-ui .data-panel table.is-admin td[data-label="ตำแหน่ง"],
            body.modern-ui .data-panel table.is-admin td[data-label="แผนก/กลุ่มงาน"] {
                font-size: 13px;
                line-height: 1.4;
            }

            body.modern-ui .person-avatar {
                display: inline-flex;
                flex-shrink: 0;
                align-items: center;
                justify-content: center;
                width: 32px;
                height: 32px;
                border-radius: 50%;
                font-size: 13px;
                font-weight: 600;
                color: var(--ui-blue);
                background: var(--ui-tint);
            }

            body.modern-ui .rank-badge {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                min-width: 30px;
                height: 30px;
                padding: 0 8px;
                border-radius: 9px;
                font-size: 13px;
                font-weight: 600;
                color: var(--ui-ink-soft);
                background: #eef1f6;
                font-variant-numeric: tabular-nums;
            }

            body.modern-ui .rank-badge.rank-1 {
                color: #fff;
                background: var(--ui-gradient);
                box-shadow: 0 8px 16px -8px rgba(37,99,235,0.8);
            }

            body.modern-ui .rank-badge.rank-2,
            body.modern-ui .rank-badge.rank-3 {
                color: var(--ui-blue);
                background: var(--ui-tint);
            }

            body.modern-ui .score-cell {
                display: inline-flex;
                flex-direction: column;
                gap: 5px;
                width: 92px;
            }

            body.modern-ui .score-value {
                align-self: center;
                font-weight: 600;
                color: var(--ui-ink);
                font-variant-numeric: tabular-nums;
            }

            /* สีคะแนน 10 อันดับแรก ไล่จากเข้มไปอ่อนตามอันดับ */
            body.modern-ui .score-cell.is-top .score-value {
                width: 100%;
                padding: 3px 6px;
                border-radius: 8px;
                text-align: center;
                color: var(--top-fg);
                background: var(--top-bg);
            }

            body.modern-ui .score-cell.is-top .meter > i {
                background: var(--top-bg);
            }

            body.modern-ui .grade-pill {
                display: inline-flex;
                align-items: center;
                gap: 6px;
                padding: 3px 10px;
                border-radius: 99px;
                font-size: 12.5px;
                font-weight: 500;
                white-space: nowrap;
            }

            body.modern-ui .grade-pill::before {
                content: "";
                width: 6px;
                height: 6px;
                border-radius: 50%;
                background: currentColor;
            }

            body.modern-ui .grade-excellent { color: #047857; background: #e3f8ef; }
            body.modern-ui .grade-great { color: #1d4ed8; background: #e7efff; }

          if (aDone && bDone) {

            if (scoreDiff !== 0) return scoreDiff;
          }

          const dateDiff = new Date(b?.date || 0) - new Date(a?.date || 0);
          if (Number.isFinite(dateDiff) && dateDiff !== 0) return dateDiff;

          return getEmployeeName(a).localeCompare(getEmployeeName(b), 'th');
        });

        const API_ERROR_MESSAGES = {
          AUTH: 'หมดเวลาการเข้าสู่ระบบ กรุณาเข้าสู่ระบบอีกครั้ง',
          BAD_LOGIN: 'ชื่อผู้ใช้งานหรือรหัสผ่านไม่ถูกต้อง',
          RATE_LIMITED: 'ใส่รหัสผิดหลายครั้ง กรุณารอ 15 นาทีแล้วลองใหม่อีกครั้ง',
          BAD_CODE: 'รหัสแก้ไขไม่ถูกต้อง',
          NO_CODE: 'แบบประเมินนี้ยังไม่มีรหัสแก้ไข กรุณาติดต่อหัวหน้าเพื่อขอตั้งรหัส',
          INVALID_CODE: 'รหัสแก้ไขต้องมีอย่างน้อย 4 ตัวอักษร',
          LOCKED: 'หัวหน้าประเมินแบบฟอร์มนี้แล้วจึงแก้ไขไม่ได้ กรุณาติดต่อหัวหน้าเพื่อปลดล็อก',
          DUPLICATE: 'บุคคลนี้มีแบบประเมินในปีงบประมาณและรอบนี้แล้ว',
          NOT_FOUND: 'ไม่พบแบบประเมินนี้ในฐานข้อมูล กรุณารีเฟรชหน้าเว็บแล้วลองใหม่อีกครั้ง',
          INVALID: 'ข้อมูลไม่ครบหรือไม่ถูกต้อง กรุณาตรวจสอบแล้วลองใหม่อีกครั้ง',
          CONFIG: 'ระบบยังไม่ได้ตั้งค่าบัญชีหัวหน้าใน Script Properties',
          BUSY: 'ระบบกำลังทำงานหนาแน่น กรุณาลองใหม่อีกครั้ง'
        };
        const CONNECTION_ERROR_MESSAGE = 'เชื่อมต่อฐานข้อมูลไม่สำเร็จ กรุณาตรวจสอบอินเทอร์เน็ตแล้วลองใหม่อีกครั้ง';
        const getApiErrorMessage = (error) => API_ERROR_MESSAGES[error?.code] || CONNECTION_ERROR_MESSAGE;

        const readApiResponse = async (response) => {
          const data = await response.json();
          if (!data || data.ok !== true) {
            const error = new Error(`API error: ${data?.code}`);
            error.code = data?.code;
            throw error;
          }
          return data;
        };

        // ใช้ text/plain เพื่อให้เบราว์เซอร์ไม่ส่ง preflight ซึ่ง Apps Script ไม่รองรับ จึงอ่านผลตอบกลับได้
        const callApi = async (action, payload = {}) => {
          const response = await fetch(GOOGLE_SHEET_WEBAPP_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({ ...payload, action }),
          });
          return readApiResponse(response);
        };

        // แสดงรหัสแก้ไขให้เห็น เพื่อให้รู้ทันทีถ้าแป้นพิมพ์เป็นภาษาไทย และเบราว์เซอร์จะไม่เติมรหัสผ่านที่บันทึกไว้ลงช่องนี้
        const EDIT_CODE_INPUT_PROPS = { type: 'text', autoComplete: 'off', autoCapitalize: 'none', autoCorrect: 'off', spellCheck: false };
        const hasNonEnglishChars = (text) => /[^\x20-\x7E]/.test(String(text ?? ''));
        const NON_ENGLISH_CODE_MESSAGE = 'รหัสแก้ไขใช้ได้เฉพาะตัวเลขหรือตัวอักษรภาษาอังกฤษ กรุณาตรวจว่าแป้นพิมพ์เป็นภาษาอังกฤษ';

        const normalizeRecord = (emp) => ({
          ...emp,
          fiscalYear: getEmployeeFiscalYear(emp),
          period: getEmployeePeriod(emp)
        });

        // ไม่มี token ได้เฉพาะข้อมูลสาธารณะ มี token ของหัวหน้าจึงได้คะแนนและความเห็น
        const fetchEmployeesFromDb = async (token) => {
          const data = token
            ? await callApi('list', { token })
            : await readApiResponse(await fetch(`${GOOGLE_SHEET_WEBAPP_URL}?t=${Date.now()}`, { cache: 'no-store' }));
          if (!Array.isArray(data.rows)) throw new Error('Unexpected database response');
          return { rows: data.rows.map(normalizeRecord).reverse(), stats: data.stats || {} };
        };

        const filterEmployeesByReport = (list, filters) => list.filter(emp => {
          const matchFiscalYear = filters.fiscalYear === 'all' || getEmployeeFiscalYear(emp) === filters.fiscalYear;
          const matchPeriod = filters.period === 'all' || getEmployeePeriod(emp) === filters.period;
          return matchFiscalYear && matchPeriod;
        });

        // แยกรายชื่อตามรอบการประเมิน แต่ละรอบเรียงคะแนนและจัดอันดับแยกกัน
        // ถ้ามีข้อมูลหลายปีงบประมาณ จะแยกตามปีด้วย เพื่อไม่ให้จัดอันดับข้ามปี
        const groupEmployeesByPeriod = (list, periodFilter) => {
          const otherPeriods = list.map(getEmployeePeriod).filter(period => !periodOptions.includes(period));
          const periods = periodFilter === 'all' ? [...new Set([...periodOptions, ...otherPeriods])] : [periodFilter];
          const years = [...new Set(list.map(getEmployeeFiscalYear))].sort((a, b) => Number(b) - Number(a));
          if (years.length <= 1) {
            return periods.map(period => ({
              period,
              fiscalYear: null,
              items: sortEmployeesByScoreDesc(list.filter(emp => getEmployeePeriod(emp) === period))
            }));
          }
          return years.flatMap(fiscalYear => periods.map(period => ({
            period,
            fiscalYear,
            items: sortEmployeesByScoreDesc(list.filter(emp => getEmployeePeriod(emp) === period && getEmployeeFiscalYear(emp) === fiscalYear))
          }))).filter(group => group.items.length > 0);
        };

        const getGroupTitle = ({ period, fiscalYear }) => fiscalYear ? `ปีงบประมาณ ${fiscalYear} ${period}` : period;

        const hasEvaluationInPeriod = (list, name, fiscalYear, period) => list.some(emp =>
          (normalizeName(emp.name) === normalizeName(name) || normalizeName(emp.employeeName) === normalizeName(name)) && getEmployeeFiscalYear(emp) === fiscalYear && getEmployeePeriod(emp) === period
        );

        const getResultText = (emp) => {
          if (!checkManagerEvaluated(emp)) return 'รอประเมิน';
          const result = getEmployeeScore(emp) >= 60 ? 'ผ่าน' : 'ไม่ผ่าน';
          return emp.grade ? `${emp.grade} / ${result}` : result;
        };

        // ==========================================
        // ส่งออกไฟล์ Word (.docx)
        // ==========================================
        const WORD_FONT = 'TH SarabunPSK';
        const WORD_CONTENT_WIDTH = 9638; // ความกว้างหน้า A4 หักขอบกระดาษข้างละ 2 ซม. (หน่วย DXA)
        const WORD_HEADER_FILL = 'E0F2FE';
        const WORD_EMPTY_NAME = '...........................................';
        const WORD_EMPTY_DATE = 'วันที่ ......../......../..........';

        const wordRun = (text, { pt = 16, bold = false, italics = false } = {}) =>
          new docx.TextRun({ text: String(text ?? ''), font: WORD_FONT, size: pt * 2, bold, italics });

        const wordParagraph = (text, { align = 'left', before = 0, after = 0, keepNext = false, ...runOptions } = {}) =>
          new docx.Paragraph({ alignment: align, spacing: { before, after }, keepNext, children: [wordRun(text, runOptions)] });

        const wordLabelValue = (label, value) => new docx.Paragraph({
          indent: { left: 280 },
          children: [wordRun(`${label}: `, { bold: true }), wordRun(value || '-')]
        });

        const wordCell = (content, width, { span = 1, shaded = false, ...paragraphOptions } = {}) => new docx.TableCell({
          width: { size: width, type: docx.WidthType.DXA },
          columnSpan: span,
          verticalAlign: docx.VerticalAlign.CENTER,
          margins: { top: 30, bottom: 30, left: 80, right: 80 },
          shading: shaded ? { type: docx.ShadingType.CLEAR, color: 'auto', fill: WORD_HEADER_FILL } : undefined,
          children: Array.isArray(content) ? content : [wordParagraph(content, paragraphOptions)]
        });

        const wordRow = (cells, isHeader = false) => new docx.TableRow({ tableHeader: isHeader, cantSplit: true, children: cells });

        const wordTable = (columnWidths, rows, borders) => new docx.Table({
          width: { size: columnWidths.reduce((sum, width) => sum + width, 0), type: docx.WidthType.DXA },
          columnWidths,
          rows,
          ...(borders ? { borders } : {})
        });

        const wordHeaderCells = (labels, widths) => labels.map((label, i) => wordCell(label, widths[i], { align: 'center', bold: true, shaded: true }));

        const wordReportTitle = (title) => [
          wordParagraph(title, { align: 'center', pt: 18, bold: true }),
          wordParagraph('งานอุบัติเหตุฉุกเฉินและนิติเวช', { align: 'center', pt: 18 }),
          wordParagraph('โรงพยาบาลเสลภูมิ', { align: 'center', pt: 18 }),
          wordParagraph('สังกัดสำนักงานปลัดกระทรวงสาธารณสุข', { align: 'center', pt: 18 })
        ];

        const wordSignature = (lines, { title, signLine = true }) => [
          wordParagraph(title, { align: 'center', after: 360, keepNext: true, bold: !signLine, pt: signLine ? 16 : 18 }),
          ...(signLine ? [wordParagraph('ลงชื่อ ...........................................', { align: 'center', keepNext: true })] : []),
          ...lines.map((line, i) => wordParagraph(line, { align: 'center', keepNext: i < lines.length - 1 }))
        ];

        const saveWordFile = async (children, fileName) => {
          if (!window.docx) {
            alert('โหลดเครื่องมือส่งออก Word ไม่สำเร็จ กรุณาตรวจสอบอินเทอร์เน็ตแล้วเปิดหน้าเว็บใหม่');
            return;
          }
          try {
            const doc = new docx.Document({
              sections: [{
                properties: { page: { size: { width: 11906, height: 16838 }, margin: { top: 1134, right: 1134, bottom: 1134, left: 1134 } } },
                children: children()
              }]
            });
            const blob = await docx.Packer.toBlob(doc);
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = `${fileName.replace(/[\\/:*?"<>|]/g, '-')}.docx`;
            document.body.appendChild(link);
            link.click();
            link.remove();
            setTimeout(() => URL.revokeObjectURL(url), 1000);
          } catch (error) {
            console.error('Word export error:', error);
            alert('ส่งออกไฟล์ Word ไม่สำเร็จ กรุณาลองใหม่อีกครั้ง');
          }
        };

        const exportEvaluationToWord = (data) => {
          const name = data.employeeName || data.name || 'ไม่ระบุชื่อ';
          const period = getEmployeePeriod(data);
          const fiscalYear = getEmployeeFiscalYear(data);
          const scoreText = (value, multiplier = 1) => Number(value) ? (Number(value) * multiplier).toFixed(2) : '-';

          const buildChildren = () => {
            const scoreWidths = [4538, 1600, 1600, 1900];
            const scoreRow = (label, value, weight) => wordRow([
              wordCell(label, scoreWidths[0]),
              wordCell(scoreText(value), scoreWidths[1], { align: 'center' }),
              wordCell(String(weight), scoreWidths[2], { align: 'center' }),
              wordCell(scoreText(value, weight / 100), scoreWidths[3], { align: 'center', bold: true })
            ]);
            const gradeOptions = [['ดีเด่น', 'ดีเด่น (90-100%)'], ['ดีมาก', 'ดีมาก (80-89%)'], ['ดี', 'ดี (70-79%)'], ['พอใช้', 'พอใช้ (60-69%)'], ['ต้องปรับปรุง', 'ปรับปรุง (<60%)']];
            const gradeWidth = Math.floor(WORD_CONTENT_WIDTH / gradeOptions.length);
            const signatureWidth = Math.floor(WORD_CONTENT_WIDTH / 2);
            const signatureCell = (title, lines) => wordCell(
              [...wordSignature([...lines, WORD_EMPTY_DATE], { title }), wordParagraph('', { pt: 10 })],
              signatureWidth
            );

            return [
              ...wordReportTitle('ใบสรุปผลการประเมินประสิทธิภาพการปฏิบัติงาน'),
              wordParagraph('ส่วนที่ ๑ ข้อมูลของผู้รับการประเมิน', { pt: 18, bold: true, before: 200, keepNext: true }),
              wordLabelValue('ชื่อผู้เข้ารับการประเมิน', name),
              wordLabelValue('ตำแหน่ง', data.position),
              wordLabelValue('งาน/กลุ่มงาน', data.department),
              wordLabelValue('ปีงบประมาณ', fiscalYear),
              wordLabelValue('รอบการประเมิน', period),
              wordParagraph('ส่วนที่ ๔ การสรุปผลการประเมินทั้งปี', { pt: 18, bold: true, before: 200, after: 60, keepNext: true }),
              wordTable(scoreWidths, [
                wordRow(wordHeaderCells(['องค์ประกอบการประเมิน', 'คะแนนเฉลี่ย (ก)', 'น้ำหนัก (ข) %', 'รวมคะแนน (ก)X(ข)'], scoreWidths), true),
                scoreRow('ผลการประเมินด้านผลสัมฤทธิ์ของงาน', data.kpiScoreFinal, 70),
                scoreRow('ผลการประเมินด้านพฤติกรรมการปฏิบัติงาน', data.behaviorScoreFinal, 30),
                wordRow([
                  wordCell('รวมคะแนนสุทธิ', scoreWidths[0] + scoreWidths[1], { span: 2, align: 'right', bold: true, shaded: true }),
                  wordCell('100', scoreWidths[2], { align: 'center', bold: true, shaded: true }),
                  wordCell(scoreText(data.totalScore), scoreWidths[3], { align: 'center', bold: true, shaded: true, pt: 18 })
                ])
              ]),
              wordParagraph('ระดับผลการประเมิน', { align: 'center', bold: true, before: 200, after: 60, keepNext: true }),
              wordTable(gradeOptions.map(() => gradeWidth), [
                wordRow(gradeOptions.map(([grade, label]) => wordCell(`[ ${data.grade === grade ? '✓' : '  '} ] ${label}`, gradeWidth, { align: 'center', pt: 14, bold: data.grade === grade })))
              ]),
              wordParagraph('ความคิดเห็นเพิ่มเติมของผู้ประเมิน', { bold: true, before: 200, keepNext: true }),
              wordParagraph(data.comments || 'ไม่มีความคิดเห็นเพิ่มเติม', { italics: true }),
              wordParagraph('ส่วนที่ ๕ การรับทราบผลการประเมิน', { pt: 18, bold: true, before: 240, after: 120, keepNext: true }),
              wordTable([signatureWidth, signatureWidth], [
                wordRow([
                  signatureCell('ผู้รับการประเมินได้รับทราบผลการประเมินแล้ว', [`( ${name} )`, `ตำแหน่ง ${data.position || '-'}`]),
                  signatureCell('ผู้ประเมิน', [`( ${data.evaluatorName || WORD_EMPTY_NAME} )`, 'ตำแหน่ง ผู้บังคับบัญชาชั้นต้น'])
                ]),
                wordRow([
                  signatureCell('เห็นชอบผลการประเมิน', [`( ${WORD_EMPTY_NAME} )`, 'ตำแหน่ง หัวหน้ากลุ่มงานการพยาบาล']),
                  signatureCell('เห็นชอบผลการประเมิน', ['( นายบุญมี โพธิ์สนาม )', 'ตำแหน่ง ผู้อำนวยการโรงพยาบาลเสลภูมิ'])
                ])
              ], docx.TableBorders.NONE)
            ];
          };

          return saveWordFile(buildChildren, `ใบสรุปผลการประเมิน_${name}_ปีงบ${fiscalYear}_${period.split(' (')[0]}`);
        };

        const exportSummaryToWord = (employees, filters) => {
          const fiscalYearLabel = filters.fiscalYear === 'all' ? 'ทุกปีงบประมาณ' : `ปีงบประมาณ ${filters.fiscalYear}`;
          const periodLabel = filters.period === 'all' ? 'ทุกรอบการประเมิน' : filters.period;

          const buildChildren = () => {
            const filtered = filterEmployeesByReport(employees, filters);
            const evaluated = filtered.filter(checkManagerEvaluated);
            const avgScore = evaluated.length > 0 ? evaluated.reduce((sum, emp) => sum + getEmployeeScore(emp), 0) / evaluated.length : 0;
            const summaryWidth = Math.floor(WORD_CONTENT_WIDTH / 3);
            const summaryCell = (label, value) => wordCell([
              wordParagraph(label, { align: 'center', bold: true }),
              wordParagraph(value, { align: 'center' })
            ], summaryWidth);
            const widths = [950, 2950, 2300, 700, 1138, 1600];
            const headers = ['ลำดับคะแนน', 'ชื่อ-สกุล', 'ตำแหน่ง', 'ปีงบฯ', 'ผลคะแนนรวม', 'ระดับ/สถานะ'];

            const groupSections = groupEmployeesByPeriod(filtered, filters.period).flatMap(({ period, fiscalYear, items }) => [
              wordParagraph(getGroupTitle({ period, fiscalYear }), { pt: 18, bold: true, before: 240, after: 60, keepNext: true }),
              wordTable(widths, [
                wordRow(wordHeaderCells(headers, widths), true),
                ...(items.length > 0 ? items.map((emp, index) => {
                  const isEvaluated = checkManagerEvaluated(emp);
                  return wordRow([
                    wordCell(isEvaluated ? String(index + 1) : '-', widths[0], { align: 'center', bold: true }),
                    wordCell(getEmployeeName(emp), widths[1]),
                    wordCell(emp.position || '-', widths[2]),
                    wordCell(getEmployeeFiscalYear(emp), widths[3], { align: 'center' }),
                    wordCell(isEvaluated ? formatScore(getEmployeeScore(emp)) : '-', widths[4], { align: 'center', bold: true }),
                    wordCell(getResultText(emp), widths[5], { align: 'center', bold: isEvaluated })
                  ]);
                }) : [wordRow([wordCell('ยังไม่มีข้อมูลผู้รับการประเมินในรอบนี้', WORD_CONTENT_WIDTH, { span: widths.length, align: 'center' })])])
              ])
            ]);

            return [
              ...wordReportTitle('ใบสรุปผลการประเมินประสิทธิภาพการปฏิบัติงาน (รวมทุกรายชื่อ)'),
              wordParagraph('แยกตามรอบการประเมิน เรียงตามคะแนนรวมจากมากสุดไปน้อยสุด', { align: 'center', pt: 14, before: 80 }),
              wordParagraph(`${fiscalYearLabel} / ${periodLabel}`, { align: 'center', pt: 14, after: 160 }),
              wordTable([summaryWidth, summaryWidth, summaryWidth], [wordRow([
                summaryCell('บุคลากรทั้งหมด', `${filtered.length} ราย`),
                summaryCell('ประเมินครบแล้ว', `${evaluated.length} ราย`),
                summaryCell('คะแนนเฉลี่ยรวม', `${formatScore(avgScore)}%`)
              ])]),
              ...groupSections,
              wordParagraph('', { after: 360 }),
              ...wordSignature(['( นายทวี แสนสนอง )', 'ตำแหน่ง หัวหน้างานการพยาบาลอุบัติเหตุฉุกเฉินและนิติเวช', WORD_EMPTY_DATE], { title: 'ผู้รายงาน', signLine: false }),
              wordParagraph('', { after: 360 }),
              ...wordSignature([`( ${WORD_EMPTY_NAME} )`, 'ตำแหน่ง หัวหน้ากลุ่มงานการพยาบาล', WORD_EMPTY_DATE], { title: 'ผู้รับรองข้อมูล', signLine: false })
            ];
          };

          return saveWordFile(buildChildren, `ใบสรุปผลการประเมินรวม_${fiscalYearLabel}_${periodLabel.split(' (')[0]}`);
        };

        // ==========================================
        // แอปพลิเคชันหลัก
        // ==========================================
        function PerformanceEvaluationApp() {
          const [isLoggedIn, setIsLoggedIn] = useState(false);
          const [currentView, setCurrentView] = useState('dashboard');
          const [employees, setEmployees] = useState([]); 
          const [currentEval, setCurrentEval] = useState(null);
          const [printFilters, setPrintFilters] = useState({ fiscalYear: 'all', period: 'all' });
          const [toastMessage, setToastMessage] = useState('');
          const [itemToDelete, setItemToDelete] = useState(null);
          const [isLoadingData, setIsLoadingData] = useState(true);
          const [isSaving, setIsSaving] = useState(false);
          const isSavingRef = useRef(false);
          const loadRequestRef = useRef(0);
          const contentRef = useRef(null);
          // เก็บในหน่วยความจำเท่านั้น รีเฟรชหน้าเว็บแล้วต้องเข้าสู่ระบบหรือใส่รหัสใหม่
          const tokenRef = useRef(null);
          const selfEditCodeRef = useRef('');
          const [publicStats, setPublicStats] = useState({});
          const [editCodeTarget, setEditCodeTarget] = useState(null);

          // เปลี่ยนหน้าแล้วเริ่มที่ด้านบนเสมอ ไม่ค้างตำแหน่งเลื่อนของหน้าก่อน
          useEffect(() => {
            if (contentRef.current) contentRef.current.scrollTop = 0;
          }, [currentView]);

          const applyLoadedData = ({ rows, stats }) => {
            setEmployees(rows);
            setPublicStats(stats);
            return rows;
          };

          // token หมดอายุ: ล้างข้อมูลของหัวหน้าออกจากหน้าจอ แล้วโหลดข้อมูลสาธารณะแทน
          const endManagerSession = () => {
            tokenRef.current = null;
            loadRequestRef.current++;
            setIsLoggedIn(false);
            setEmployees([]);
            setCurrentEval(null);
            setCurrentView('dashboard');
            fetchEmployeesFromDb(null).then(applyLoadedData).catch(error => console.error("Refresh Error:", error));
          };

          // ดึงข้อมูลล่าสุดจากฐานข้อมูล ไม่ทับข้อมูลระหว่างบันทึก และไม่ใช้ผลของคำขอที่เก่ากว่า
          const refreshEmployees = async () => {
            if (isSavingRef.current) return;
            const requestId = ++loadRequestRef.current;
            try {
              const result = await fetchEmployeesFromDb(tokenRef.current);
              if (requestId === loadRequestRef.current && !isSavingRef.current) applyLoadedData(result);
            } catch (error) {
              if (error.code !== 'AUTH') throw error;
              alert(API_ERROR_MESSAGES.AUTH);
              endManagerSession();
            }
          };

          // ดึงข้อมูลตอนเปิดหน้าเว็บครั้งแรก
          useEffect(() => {
            const fetchInitialData = async () => {
              try {
                await refreshEmployees();
              } catch (error) {
                console.error("Fetch Error:", error);
                showToast("เชื่อมต่อฐานข้อมูลล้มเหลว หรือยังไม่มีข้อมูล");
              }
              setIsLoadingData(false);
            };
            fetchInitialData();
          }, []);

          // กลับมาหน้าแรกหรือสลับกลับมาที่แท็บนี้ ให้แสดงข้อมูลล่าสุดเสมอ
          useEffect(() => {
            if (currentView === 'dashboard' && !isLoadingData) {
              refreshEmployees().catch(error => console.error("Refresh Error:", error));
            }
          }, [currentView]);

          useEffect(() => {
            const handleVisibilityChange = () => {
              if (document.visibilityState === 'visible') {
                refreshEmployees().catch(error => console.error("Refresh Error:", error));
              }
            };
            document.addEventListener('visibilitychange', handleVisibilityChange);
            return () => document.removeEventListener('visibilitychange', handleVisibilityChange);
          }, []);

          const showToast = (msg) => {
            setToastMessage(msg);
            setTimeout(() => setToastMessage(''), 3000);
          };

          // กันการกดซ้ำระหว่างรอ และจัดการข้อผิดพลาดของคำขอเขียนข้อมูลที่เดียว
          const runWrite = async (work) => {
            if (isSavingRef.current) return;
            isSavingRef.current = true;
            setIsSaving(true);
            loadRequestRef.current++;
            try {
              await work();
            } catch (error) {
              console.error(error);
              alert(getApiErrorMessage(error));
              if (error.code === 'AUTH') endManagerSession();
            } finally {
              isSavingRef.current = false;
              setIsSaving(false);
            }
          };

          const reloadEmployees = async () => applyLoadedData(await fetchEmployeesFromDb(tokenRef.current));

          const handleLogin = async (username, password) => {
            try {
              const { token } = await callApi('login', { username, password });
              tokenRef.current = token;
              loadRequestRef.current++;
              await reloadEmployees();
              setIsLoggedIn(true);
              setCurrentView('dashboard');
              return null;
            } catch (error) {
              console.error(error);
              tokenRef.current = null;
              return getApiErrorMessage(error);
            }
          };

          const handleLogout = () => {
            const token = tokenRef.current;
            endManagerSession();
            callApi('logout', { token }).catch(error => console.error('Logout error:', error));
          };

          // ผู้รับการประเมินใส่รหัสถูกต้องจึงได้ข้อมูลของตนเองมาแก้ไข
          const handleOpenForEdit = async (code) => {
            try {
              const { record } = await callApi('openForEdit', { id: editCodeTarget.id, code });
              selfEditCodeRef.current = code;
              setCurrentEval(normalizeRecord(record));
              setEditCodeTarget(null);
              setCurrentView('form');
              return null;
            } catch (error) {
              console.error(error);
              if (error.code === 'LOCKED') refreshEmployees().catch(err => console.error("Refresh Error:", err));
              return getApiErrorMessage(error);
            }
          };

          const handleDeleteEvaluation = async () => {
            if (!itemToDelete) return;
            const targetId = itemToDelete.id;
            setItemToDelete(null);
            await runWrite(async () => {
              showToast('กำลังลบข้อมูล...');
              await callApi('delete', { token: tokenRef.current, id: targetId });
              await reloadEmployees();
              showToast('ลบข้อมูลเรียบร้อยแล้ว');
            });
          };

          const handleSaveEvaluation = async (evalData) => {
            if (!evalData) return;
            const recordToSave = {
              ...evalData,
              fiscalYear: getEmployeeFiscalYear(evalData),
              period: getEmployeePeriod(evalData)
            };

            await runWrite(async () => {
              showToast('กำลังบันทึกข้อมูลไปยัง Google Sheets...');
              try {
                if (isLoggedIn) {
                  await callApi('save', { ...recordToSave, name: evalData.employeeName, token: tokenRef.current });
                } else if (currentEval) {
                  await callApi('selfSave', { ...recordToSave, code: selfEditCodeRef.current });
                } else {
                  await callApi('selfCreate', recordToSave);
                }
              } catch (error) {
                // หัวหน้าลงคะแนนหรือล็อกระหว่างเปิดฟอร์ม ข้อมูลเดิมจะไม่ถูกเขียนทับ
                if (error.code === 'LOCKED') {
                  await reloadEmployees().catch(err => console.error("Refresh Error:", err));
                  setCurrentEval(null);
                  setCurrentView('dashboard');
                }
                throw error;
              }

              const rows = await reloadEmployees();
              selfEditCodeRef.current = '';
              setCurrentEval(isLoggedIn ? rows.find(e => String(e.id) === String(recordToSave.id)) || null : null);
              showToast('บันทึกลงฐานข้อมูลสำเร็จ!');
              setCurrentView('dashboard');
            });
          };

          const handleSetSelfEditUnlocked = async (emp, unlocked) => {
            await runWrite(async () => {
              showToast(unlocked ? 'กำลังปลดล็อก...' : 'กำลังล็อก...');
              await callApi('setUnlocked', { token: tokenRef.current, id: emp.id, unlocked });
              await reloadEmployees();
              showToast(unlocked ? 'ปลดล็อกแล้ว ผู้รับการประเมินแก้ไขได้ 1 ครั้ง' : 'ล็อกการแก้ไขแล้ว');
            });
          };

          // ป้องกันหน้าจอกระพริบตอนกำลังโหลด
          if (isLoadingData) {
            return (
              <div className="app-shell flex h-screen w-screen items-center justify-center bg-gray-50">
                <div className="text-center">
                  <div className="w-12 h-12 border-4 border-blue-500 border-t-transparent rounded-full animate-spin mx-auto mb-4"></div>
                  <h2 className="text-xl font-bold text-gray-700">กำลังโหลดข้อมูลจากฐานข้อมูล...</h2>
                </div>
              </div>
            );
          }

          return (
            <div className="app-shell flex h-screen bg-gray-50 text-gray-800 font-sans">
              {isLoggedIn && (
                <aside className="admin-sidebar w-64 bg-slate-900 text-white flex flex-col hidden sm:flex print:hidden">
                  <div className="p-6 flex items-center gap-3">
                    <span className="brand-mark"><Activity className="w-5 h-5" /></span>
                    <div>
                      <h1 className="text-base font-semibold text-white leading-tight">ระบบจัดการ (Admin)</h1>
                      <p className="text-xs text-slate-400 mt-0.5">เฉพาะหัวหน้าผู้ประเมิน</p>
                    </div>
                  </div>
                  <nav className="flex-1 px-4 space-y-2">
                    <NavItem icon={<Users />} label="แดชบอร์ดรวม" active={currentView === 'dashboard'} onClick={() => setCurrentView('dashboard')} />
                  </nav>
                  <div className="sidebar-foot">
                    <p className="font-medium text-slate-200">โรงพยาบาลเสลภูมิ</p>
                    <p>งานอุบัติเหตุฉุกเฉินและนิติเวช</p>
                  </div>
                </aside>
              )}

              <main className="flex-1 flex flex-col overflow-hidden relative">
                <header className="app-header bg-white shadow-sm h-16 flex items-center justify-between px-6 print:hidden z-10">
                  <div className="flex items-center gap-3">
                    <span className={`brand-mark ${isLoggedIn ? 'brand-when-no-sidebar' : ''}`}><Activity className="w-5 h-5" /></span>
                    <div>
                      <h2 className="text-lg font-semibold text-gray-800 leading-tight">
                        {currentView === 'dashboard' && 'ระบบประเมินประสิทธิภาพการปฏิบัติงาน'}
                        {currentView === 'form' && 'แบบประเมินประสิทธิภาพและประสิทธิผล'}
                        {currentView === 'print' && 'สรุปผลการประเมินรายบุคคล'}
                        {currentView === 'printAll' && 'ใบสรุปผลรวมทุกรายชื่อ'}
                        {currentView === 'login' && 'เข้าสู่ระบบ'}
                      </h2>
                      <p className="app-subtitle">งานอุบัติเหตุฉุกเฉินและนิติเวช · โรงพยาบาลเสลภูมิ</p>
                    </div>
                  </div>
                  
                  <div className="flex items-center gap-4">
                    {isLoggedIn ? (
                      <button onClick={handleLogout} className="flex items-center gap-2 text-red-600 hover:bg-red-50 px-3 py-1.5 rounded-lg transition-colors font-medium">
                        <LogOut className="w-5 h-5" /> ออกจากระบบ
                      </button>
                    ) : (
                      <button onClick={() => setCurrentView('login')} className="flex items-center gap-2 text-slate-600 bg-slate-100 hover:bg-slate-200 px-4 py-2 rounded-lg transition-colors font-medium">
                        <Lock className="w-4 h-4" /> สำหรับหัวหน้าประเมิน
                      </button>
                    )}
                  </div>
                </header>

                <div ref={contentRef} className="app-content flex-1 overflow-auto p-6 relative print:overflow-visible">
                  {toastMessage && (
                    <div className="app-toast absolute top-4 right-4 bg-green-600 text-white px-4 py-2 rounded-lg shadow-lg flex items-center gap-2 z-50 animate-bounce print:hidden">
                      <CheckCircle className="w-5 h-5" />
                      {toastMessage}
                    </div>
                  )}

                  {itemToDelete && (
                    <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 print:hidden">
                      <div className="danger-modal bg-white p-6 rounded-2xl shadow-xl max-w-sm w-full border border-gray-100 animate-in fade-in zoom-in duration-200">
                        <div className="flex items-center gap-3 mb-4 text-red-600">
                          <div className="p-3 bg-red-50 rounded-full">
                            <Trash2 className="w-6 h-6" />
                          </div>
                          <h3 className="text-xl font-bold text-gray-900">ยืนยันการลบข้อมูล</h3>
                        </div>
                        <p className="text-gray-600 mb-6 leading-relaxed">
                          คุณแน่ใจหรือไม่ว่าต้องการลบข้อมูลการประเมินของ <br/>
                          <span className="font-bold text-gray-900">{itemToDelete.name || itemToDelete.employeeName}</span> ? <br/>
                          <span className="text-sm text-red-500 mt-2 block">* การกระทำนี้ไม่สามารถย้อนกลับได้</span>
                        </p>
                        <div className="flex justify-end gap-3">
                          <button 
                            onClick={() => setItemToDelete(null)} 
                            className="px-4 py-2 text-gray-700 bg-gray-100 hover:bg-gray-200 rounded-lg font-medium transition-colors"
                          >
                            ยกเลิก
                          </button>
                          <button 
                            onClick={handleDeleteEvaluation} 
                            className="px-4 py-2 bg-red-600 text-white hover:bg-red-700 rounded-lg font-medium shadow-md transition-colors flex items-center gap-2"
                          >
                            ยืนยันการลบ
                          </button>
                        </div>
                      </div>
                    </div>
                  )}

                  {editCodeTarget && (
                    <EditCodeModal
                      name={getEmployeeName(editCodeTarget)}
                      onSubmit={handleOpenForEdit}
                      onCancel={() => setEditCodeTarget(null)}
                    />
                  )}

                  {currentView === 'login' && <LoginScreen onLogin={handleLogin} onCancel={() => setCurrentView('dashboard')} />}
                  
                  {currentView === 'dashboard' && (
                    <DashboardView 
                      isLoggedIn={isLoggedIn}
                      employees={employees}
                      publicStats={publicStats}
                      onNew={() => { setCurrentEval(null); setCurrentView('form'); }}
                      onEdit={(emp) => {
                        if (isLoggedIn) {
                          setCurrentEval(emp);
                          setCurrentView('form');
                        } else {
                          setEditCodeTarget(emp);
                        }
                      }}
                      onPrint={(emp) => { setCurrentEval(emp); setCurrentView('print'); }} 
                      onPrintAll={(filters) => { setPrintFilters(filters || { fiscalYear: 'all', period: 'all' }); setCurrentView('printAll'); }}
                      onDelete={(emp) => setItemToDelete(emp)}
                      onSetSelfEditUnlocked={handleSetSelfEditUnlocked}
                      isSaving={isSaving}
                    />
                  )}
                  
                  {currentView === 'form' && (
                    <EvaluationForm 
                      isLoggedIn={isLoggedIn}
                      initialData={currentEval}
                      employees={employees}
                      onSubmit={handleSaveEvaluation}
                      isSaving={isSaving}
                      onCancel={() => setCurrentView('dashboard')} 
                    />
                  )}
                  
                  {currentView === 'print' && <PrintableView data={currentEval} onBack={() => setCurrentView('dashboard')} />}

                  {currentView === 'printAll' && <PrintAllView employees={employees} filters={printFilters} onBack={() => setCurrentView('dashboard')} />}
                </div>
              </main>
            </div>
          );
        }

        // ==========================================
        // COMPONENTS ย่อย
        // ==========================================

        // ถามรหัสแก้ไขก่อนเปิดแบบประเมินของผู้รับการประเมิน
        function EditCodeModal({ name, onSubmit, onCancel }) {
          const [code, setCode] = useState('');
          const [error, setError] = useState('');
          const [isChecking, setIsChecking] = useState(false);

          const handleSubmit = async (e) => {
            e.preventDefault();
            setIsChecking(true);
            setError('');
            const message = await onSubmit(code);
            if (message) {
              setError(message);
              setIsChecking(false);
            }
          };

          return (
            <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4 print:hidden">
              <form onSubmit={handleSubmit} className="edit-code-modal bg-white p-6 rounded-2xl shadow-xl max-w-sm w-full border border-gray-100">
                <h3 className="text-xl font-bold text-gray-900 mb-1">ใส่รหัสแก้ไข</h3>
                <p className="text-sm text-gray-600 mb-4">แบบประเมินของ <span className="font-bold text-gray-900">{name}</span></p>
                {error && <div className="bg-red-50 text-red-600 p-3 rounded-lg mb-4 text-sm border border-red-100">{error}</div>}
                <input {...EDIT_CODE_INPUT_PROPS} autoFocus required value={code} onChange={e => setCode(e.target.value)} aria-label="รหัสแก้ไข" className="edit-code-input w-full border border-gray-300 p-3 rounded-lg focus:ring-blue-500 focus:border-blue-500 outline-none mb-2" />
                {hasNonEnglishChars(code) && <p className="text-xs text-orange-700 mb-2">แป้นพิมพ์อาจเป็นภาษาไทยอยู่ ตรวจรหัสที่พิมพ์อีกครั้ง</p>}
                <p className="text-xs text-gray-500 mb-5">ตัวพิมพ์เล็กและใหญ่ถือว่าต่างกัน แต่ละรอบการประเมินมีรหัสแยกกัน หากลืมรหัส กรุณาติดต่อหัวหน้าเพื่อขอตั้งรหัสใหม่</p>
                <div className="flex justify-end gap-3">
                  <button type="button" onClick={onCancel} className="px-4 py-2 text-gray-700 bg-gray-100 hover:bg-gray-200 rounded-lg font-medium transition-colors">ยกเลิก</button>
                  <button type="submit" disabled={isChecking} className="px-4 py-2 bg-blue-600 text-white hover:bg-blue-700 rounded-lg font-medium shadow-md transition-colors disabled:opacity-60 disabled:cursor-wait">{isChecking ? 'กำลังตรวจสอบ...' : 'เปิดแบบประเมิน'}</button>
                </div>
              </form>
            </div>
          );
        }

        function LoginScreen({ onLogin, onCancel }) {
          const [username, setUsername] = useState('');
          const [password, setPassword] = useState('');
          const [error, setError] = useState('');
          const [isChecking, setIsChecking] = useState(false);

          const handleSubmit = async (e) => {
            e.preventDefault();
            setIsChecking(true);
            setError('');
            const message = await onLogin(username, password);
            if (message) {
              setError(message);
              setIsChecking(false);
            }
          };

          return (
            <div className="flex justify-center items-center h-full">
              <form onSubmit={handleSubmit} className="login-panel bg-white p-10 rounded-2xl shadow-md w-full max-w-md border border-gray-100">
                <div className="flex justify-center mb-6">
                  <span className="brand-mark brand-mark-lg"><Lock className="w-7 h-7" /></span>
                </div>
                <h2 className="text-2xl font-bold text-center text-gray-800 mb-2">เข้าสู่ระบบ (เฉพาะหัวหน้า)</h2>
                <p className="text-center text-gray-500 mb-8 text-sm">เพื่อเข้าถึงการให้คะแนนและดูผลสรุปทั้งหมด</p>
                
                {error && <div className="bg-red-50 text-red-600 p-3 rounded-lg mb-4 text-sm text-center border border-red-100">{error}</div>}

                <div className="mb-4">
                  <label className="block text-sm font-medium text-gray-700 mb-2">ชื่อผู้ใช้งาน</label>
                  <input type="text" value={username} onChange={e => setUsername(e.target.value)} className="w-full border border-gray-300 p-3 rounded-lg focus:ring-blue-500 focus:border-blue-500 outline-none" required />
                </div>
                <div className="mb-8">
                  <label className="block text-sm font-medium text-gray-700 mb-2">รหัสผ่าน</label>
                  <input type="password" value={password} onChange={e => setPassword(e.target.value)} className="w-full border border-gray-300 p-3 rounded-lg focus:ring-blue-500 focus:border-blue-500 outline-none" required />
                </div>
                <div className="flex gap-3">
                  <button type="button" onClick={onCancel} className="w-1/3 bg-gray-100 text-gray-700 py-3 rounded-lg font-bold hover:bg-gray-200 transition-colors">ยกเลิก</button>
                  <button type="submit" className="w-2/3 bg-blue-600 text-white py-3 rounded-lg font-bold hover:bg-blue-700 transition-colors shadow-md">เข้าสู่ระบบ</button>
                </div>
              </form>
            </div>
          );
        }

        function NavItem({ icon, label, active, onClick }) {
          return (
            <button onClick={onClick} className={`w-full flex items-center gap-3 px-4 py-3 rounded-lg transition-colors ${active ? 'bg-blue-600 text-white' : 'text-slate-300 hover:bg-slate-800 hover:text-white'}`}>
              {React.cloneElement(icon, { className: 'w-5 h-5' })}
              <span>{label}</span>
            </button>
          );
        }

        function DashboardView({ isLoggedIn, employees, publicStats, onNew, onEdit, onPrint, onDelete, onPrintAll, onSetSelfEditUnlocked, isSaving }) {
          const [filter, setFilter] = useState('all');
          const [searchTerm, setSearchTerm] = useState('');
          const [fiscalYearFilter, setFiscalYearFilter] = useState('all');
          const [periodFilter, setPeriodFilter] = useState('all');

          const selectedPrintFilters = { fiscalYear: fiscalYearFilter, period: periodFilter };
          const scopedEmployees = filterEmployeesByReport(employees, selectedPrintFilters);

          const filteredEmployees = scopedEmployees.filter(emp => {
            const matchSearch = (emp.name || emp.employeeName || '').toLowerCase().includes(searchTerm.toLowerCase());
            if (!matchSearch) return false;
            
            const isEvaluated = checkManagerEvaluated(emp);

            if (filter === 'completed') return isEvaluated;
            if (filter === 'pending') return !isEvaluated;
            return true;
          });
          const employeeGroups = groupEmployeesByPeriod(filteredEmployees, periodFilter);

          // จัดอันดับจากรายชื่อทั้งรอบ ก่อนค้นหาหรือกรองสถานะ อันดับจึงไม่เปลี่ยนตามผลการค้นหา
          const rankById = new Map();
          groupEmployeesByPeriod(scopedEmployees, periodFilter).forEach(({ items }) => {
            items.filter(checkManagerEvaluated).forEach((emp, index) => rankById.set(emp.id, index + 1));
          });

          const evaluatedEmployees = scopedEmployees.filter(e => checkManagerEvaluated(e));
          const avgScore = evaluatedEmployees.length > 0 
            ? (evaluatedEmployees.reduce((sum, e) => sum + Number(e.totalScore || 0), 0) / evaluatedEmployees.length).toFixed(2)
            : "0.00";
          // หน้าแรกไม่ได้รับคะแนนรายคน เซิร์ฟเวอร์คำนวณค่าเฉลี่ยให้เฉพาะกลุ่มที่ประเมินแล้วถึงเกณฑ์
          const publicAvg = publicStats?.[`${fiscalYearFilter}|${periodFilter}`]?.avg;
          const displayAvg = isLoggedIn ? avgScore : (publicAvg === undefined ? null : Number(publicAvg).toFixed(2));

          return (
            <div className="dashboard-view space-y-6 max-w-6xl mx-auto">
              <section className="dash-hero">
                <svg className="hero-ecg" viewBox="0 0 900 120" preserveAspectRatio="none" aria-hidden="true">
                  <path className="hero-ecg-base" pathLength="1000" d="M0 70H120l12-8 12 8h18l8 10 14-62 14 72 10-20h44l16-10 16 10H420l12-8 12 8h18l8 10 14-62 14 72 10-20h44l16-10 16 10H720l12-8 12 8h18l8 10 14-62 14 72 10-20h82" />
                  <path className="hero-ecg-pulse" pathLength="1000" d="M0 70H120l12-8 12 8h18l8 10 14-62 14 72 10-20h44l16-10 16 10H420l12-8 12 8h18l8 10 14-62 14 72 10-20h44l16-10 16 10H720l12-8 12 8h18l8 10 14-62 14 72 10-20h82" />
                </svg>
                <div className="dash-hero-body">
                  <div>
                    <p className="hero-eyebrow">ปีงบประมาณ {getCurrentFiscalYear()} · {getPeriodLabel(getCurrentPeriod())}</p>
                    <h1 className="hero-title">{isLoggedIn ? 'ภาพรวมผลการประเมิน' : 'แบบประเมินตนเอง'}</h1>
                    <p className="hero-text">

                <div className="flex flex-wrap gap-3">

                  <h3 className="period-heading">
                    <span className="period-heading-title">

                  <div className="data-panel bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
                    <table className={`w-full min-w-[1060px] text-left ${isLoggedIn ? 'is-admin' : 'is-public'}`}>
                      <thead className="bg-slate-50 text-slate-700 border-b">
                        <tr>
                          {isLoggedIn && <th className="p-4 font-medium text-center w-24">อันดับ</th>}
                          <th className="p-4 font-medium">ชื่อ-นามสกุล</th>
                          <th className="p-4 font-medium">ตำแหน่ง</th>
                          <th className="p-4 font-medium">แผนก/กลุ่มงาน</th>

                          {isLoggedIn && (

                      </thead>
                      <tbody className="divide-y divide-gray-100">
                        {items.map((emp) => {
                          const isEvaluated = checkManagerEvaluated(emp);
                          const rank = rankById.get(emp.id);
                          return (
                            <tr key={emp.id} className="hover:bg-slate-50 transition-colors">
                              {isLoggedIn && (
                                <td className="cell-rank p-4 text-center">
                                  {isEvaluated ? (
                                    <span className={`rank-badge rank-${rank}`}>{rank}</span>

                                    <span className="text-gray-400">-</span>

                                  <span className="person-avatar" aria-hidden="true">{getNameInitial(getEmployeeName(emp))}</span>
                                  <span className="person-name">
                                    {normalizeName(getEmployeeName(emp)).split(' ').map((part, partIndex) => (

                              <td data-label="ตำแหน่ง" className="p-4 text-gray-600">{emp.position || ''}</td>
                              <td data-label="แผนก/กลุ่มงาน" className="p-4 text-gray-600">{emp.department || ''}</td>
                              <td data-label="ปีงบประมาณ" className="p-4 text-center font-medium text-blue-700">{getEmployeeFiscalYear(emp)}</td>
                              <td data-label="วันที่ประเมิน" className="p-4 text-gray-600">{formatThaiDate(emp.date)}</td>

                              {isLoggedIn && (
                                <>
                                  <td data-label="คะแนนเฉลี่ยรวม" className="p-4 text-center font-bold text-blue-600">
                                    {isEvaluated ? (
                                      <span className={`score-cell ${rank <= TOP_SCORE_COLORS.length ? 'is-top' : ''}`} style={getTopScoreStyle(rank - 1)}>
                                        <span className="score-value">{formatScore(getEmployeeScore(emp))}%</span>
                                        <span className="meter" aria-hidden="true"><i style={{ width: `${Math.min(getEmployeeScore(emp), 100)}%` }}></i></span>
                                      </span>
                                    ) : (
                                      <span className="text-gray-400 text-sm font-normal">รอหัวหน้าประเมิน</span>
                                    )}
                                  </td>
                                  <td data-label="ระดับ" className="p-4 text-center">
                                    {isEvaluated ? (
                                      <span className={`grade-pill ${getGradeClass(emp.grade)}`}>{emp.grade}</span>
                                    ) : (
                                      <span className="text-gray-400">-</span>
                                    )}
                                  </td>
                                  <td className="cell-actions p-4">
                                    <div className="flex justify-center gap-2">
                                      <button onClick={() => onEdit(emp)} className="text-blue-500 hover:text-blue-700 p-2 rounded-lg hover:bg-blue-50 transition-colors" title="แก้ไข/ประเมิน">
                                        <Edit className="w-5 h-5" />
                                      </button>
                                      {isEvaluated && (
                                        <button
                                          type="button"
                                          onClick={() => onSetSelfEditUnlocked(emp, !isSelfEditUnlocked(emp))}
                                          disabled={isSaving}
                                          aria-pressed={isSelfEditUnlocked(emp)}
                                          className={`self-lock-btn p-2 rounded-lg transition-colors disabled:opacity-50 ${isSelfEditUnlocked(emp) ? 'text-amber-600 bg-amber-50 hover:bg-amber-100' : 'text-gray-400 hover:text-slate-700 hover:bg-slate-100'}`}
                                          title={isSelfEditUnlocked(emp) ? 'ปลดล็อกอยู่ กดเพื่อล็อกการแก้ไข' : 'ล็อกอยู่ กดเพื่อปลดล็อกให้ผู้รับการประเมินแก้ไข'}
                                        >
                                          {isSelfEditUnlocked(emp) ? <Unlock className="w-5 h-5" /> : <Lock className="w-5 h-5" />}
                                        </button>
                                      )}
                                      <button onClick={() => onPrint(emp)} className="text-gray-400 hover:text-slate-700 p-2 rounded-lg hover:bg-slate-100 transition-colors" title="พิมพ์รายบุคคล">
                                        <Printer className="w-5 h-5" />
                                      </button>
                                      <button onClick={() => exportEvaluationToWord(emp)} className="text-gray-400 hover:text-blue-700 p-2 rounded-lg hover:bg-blue-50 transition-colors" title="ส่งออกเป็น Word">
                                        <FileText className="w-5 h-5" />
                                      </button>
                                      <button onClick={() => onDelete(emp)} className="text-red-400 hover:text-red-600 p-2 rounded-lg hover:bg-red-50 transition-colors" title="ลบข้อมูล">
                                        <Trash2 className="w-5 h-5" />
                                      </button>
                                    </div>
                                  </td>
                                </>
                              )}

                              {!isLoggedIn && (
                                <td className="cell-actions p-4 text-center">
                                  <div className="self-edit-actions flex justify-center">
                                    {!canSelfEdit(emp) ? (
                                      <span className="self-edit-locked" title="หัวหน้าประเมินแล้ว หากต้องการแก้ไขกรุณาติดต่อหัวหน้าเพื่อปลดล็อก">
                                        <Lock className="w-4 h-4" /> หัวหน้าประเมินแล้ว
                                      </span>
                                    ) : (
                                      <button type="button" onClick={() => onEdit(emp)} className="self-edit-btn" aria-label={`แก้ไขแบบประเมินของ ${getEmployeeName(emp)}`}>
                                        <Edit className="w-4 h-4" /> แก้ไข
                                      </button>

                                  </div>
                                </td>
                              )}
