                          );
                        })}
                        {items.length === 0 && (
                          <tr>
                            <td colSpan={isLoggedIn ? 9 : 6} className="p-8 text-center text-gray-500">
                              ไม่พบข้อมูลการประเมินในรอบนี้
                            </td>
                          </tr>
                        )}
                      </tbody>
                    </table>
                  </div>
                </div>
              ))}
            </div>
          );
        }

        function ScoreSelector({ value, onChange, disabled, label }) {
          const current = Number(value) || 0;
          return (
            <div className={`score-selector ${current > 0 ? 'has-value' : ''}`} role="group" aria-label={label}>
              {[1,2,3,4,5].map(n => (
                <button
                  key={n}
                  type="button"
                  disabled={disabled}
                  aria-pressed={current === n}
                  title={current === n ? 'กดซ้ำเพื่อล้างคะแนน' : `ให้คะแนน ${n}`}
                  onClick={() => onChange(current === n ? 0 : n)}
                  className={`score-dot score-${n} ${current === n ? 'is-active' : ''}`}
                >
                  {n}
                </button>
              ))}
            </div>
          );
        }

        function StatCard({ title, value, icon, onClick, active, progress }) {
          return (
            <div 
              onClick={onClick}
              className={`stat-card bg-white p-6 rounded-xl shadow-sm border flex items-center gap-4 ${onClick ? 'cursor-pointer transition-all hover:-translate-y-1 hover:shadow-md' : ''} ${active ? 'border-blue-500 ring-2 ring-blue-100' : 'border-gray-100'}`}
            >
              <div className="p-3 bg-slate-50 rounded-lg">{icon}</div>
              <div className="flex-1 min-w-0">
                <p className="text-sm text-gray-500 font-medium">{title}</p>
                <p className="stat-value text-2xl font-bold text-gray-800">{value}</p>
                {progress !== undefined && (
                  <span className="meter mt-2" aria-hidden="true"><i style={{ width: `${Math.min(progress, 100)}%` }}></i></span>
                )}
              </div>
            </div>
          );
        }

        function EvaluationForm({ isLoggedIn, initialData, employees, onSubmit, onCancel, isSaving }) {
          // ใช้ id เดิมเมื่อกดบันทึกซ้ำหลังบันทึกไม่สำเร็จ เพื่อไม่ให้เกิดแถวซ้ำ
          const newRecordId = useRef(Date.now());
          const [formData, setFormData] = useState({
            employeeName: '',
            position: 'พยาบาลวิชาชีพ',
            department: 'งานอุบัติเหตุฉุกเฉินและนิติเวช/กลุ่มการพยาบาล',
            fiscalYear: getCurrentFiscalYear(),
            period: 'ครั้งที่ 1 (1 ต.ค. - 31 มี.ค.)',
            evaluatorName: '',
            comments: '',
            editCode: '',
            editCodeConfirm: '',
            newEditCode: '',
            ...(initialData || {}),
            fiscalYear: initialData ? getEmployeeFiscalYear(initialData) : getCurrentFiscalYear(),
            period: initialData ? getEmployeePeriod(initialData) : getCurrentPeriod()
          });

          const [kpiScores, setKpiScores] = useState(initialData?.kpiData || defaultKpi);
          const [behaviorScores, setBehaviorScores] = useState(initialData?.behaviorData || defaultBehavior);

          const calculateRowAverage = (self, manager) => {
            let sum = 0, count = 0;
            if (self > 0) { sum += Number(self); count++; }
            if (manager > 0) { sum += Number(manager); count++; }
            return count === 0 ? 0 : sum / count;
          };

          const calculateKpiTotal = () => kpiScores.reduce((sum, item) => sum + (calculateRowAverage(item.selfScore, item.managerScore) * (item.weight / 100)), 0);
          const kpiPercentage = (calculateKpiTotal() * 100 / 5) || 0; 

          const calculateBehaviorTotal = () => behaviorScores.reduce((sum, item) => sum + (calculateRowAverage(item.selfScore, item.managerScore) * (item.weight / 100)), 0);
          const behaviorPercentage = (calculateBehaviorTotal() * 100 / 5) || 0;

          const finalScore = (kpiPercentage * 0.70) + (behaviorPercentage * 0.30);
          
          const getGrade = (score) => {
            if (score === 0) return 'รอการประเมิน';
            if (score >= 90) return 'ดีเด่น';
            if (score >= 80) return 'ดีมาก';
            if (score >= 70) return 'ดี';
            if (score >= 60) return 'พอใช้';
            return 'ต้องปรับปรุง';
          };

          const handleSubmit = (e) => {
            e.preventDefault();
            const employeeName = normalizeName(formData.employeeName || formData.name);
            if (!employeeName) {
              alert("กรุณาระบุชื่อผู้รับการประเมิน");
              return;
            }

            // ข้อที่เว้นว่างจะถูกนับเป็น 0 หรือใช้คะแนนฝั่งเดียว จึงต้องให้คะแนนครบก่อนบันทึก
            const scoreItems = [
              ...kpiScores.map(item => ({ item, label: `ส่วนที่ 2 ข้อ ${item.id}` })),
              ...behaviorScores.map(item => ({ item, label: `ส่วนที่ 3 ข้อ ${item.id}` }))
            ];
            const missingLabels = (field) => scoreItems.filter(({ item }) => !(Number(item[field]) > 0)).map(({ label }) => label);
            const missingSelf = missingLabels('selfScore');
            const missingManager = missingLabels('managerScore');
            if (!isLoggedIn && missingSelf.length > 0) {
              alert(`กรุณาให้คะแนนประเมินตนเองให้ครบทุกข้อ\nยังขาด: ${missingSelf.join(', ')}`);
              return;
            }
            if (isLoggedIn && missingManager.length > 0 && missingManager.length < scoreItems.length) {
              alert(`กรุณาให้คะแนนหัวหน้าประเมินให้ครบทุกข้อ\nยังขาด: ${missingManager.join(', ')}`);
              return;
            }
            if (isLoggedIn && missingManager.length === scoreItems.length && missingSelf.length === scoreItems.length) {
              alert('กรุณาให้คะแนนอย่างน้อยหนึ่งฝั่งให้ครบก่อนบันทึก');
              return;
            }

            if (!isLoggedIn && !initialData) {
              if (String(formData.editCode).trim().length < 4) {
                alert('กรุณาตั้งรหัสแก้ไขอย่างน้อย 4 ตัวอักษร');
                return;
              }
              if (hasNonEnglishChars(formData.editCode)) {
                alert(NON_ENGLISH_CODE_MESSAGE);
                return;
              }
              if (formData.editCode !== formData.editCodeConfirm) {
                alert('รหัสแก้ไขทั้งสองช่องไม่ตรงกัน');
                return;
              }
            }
            if (isLoggedIn && formData.newEditCode && String(formData.newEditCode).trim().length < 4) {
              alert('รหัสแก้ไขใหม่ต้องมีอย่างน้อย 4 ตัวอักษร');
              return;
            }
            if (isLoggedIn && hasNonEnglishChars(formData.newEditCode)) {
              alert(NON_ENGLISH_CODE_MESSAGE);
              return;
            }

            const targetFiscalYear = String(formData.fiscalYear || getCurrentFiscalYear());
            const targetPeriod = formData.period || periodOptions[0];
            // การแก้ไขที่ย้ายชื่อ/ปี/รอบ ต้องไม่ไปซ้ำกับแบบประเมินอีกครั้งของบุคคลเดียวกัน
            const isSameRecordSlot = !!initialData
              && normalizeName(getEmployeeName(initialData)) === employeeName
              && getEmployeeFiscalYear(initialData) === targetFiscalYear
              && getEmployeePeriod(initialData) === targetPeriod;
            if (!isSameRecordSlot && hasEvaluationInPeriod(employees, employeeName, targetFiscalYear, targetPeriod)) {
              alert("บุคคลนี้มีแบบประเมินในปีงบประมาณและรอบนี้แล้ว! กรุณากลับไปที่หน้าแรกแล้วกดปุ่ม 'แก้ไข' ที่รายชื่อนั้นแทน");
              return;
            }

            onSubmit({
              ...formData,
              employeeName,
              fiscalYear: targetFiscalYear,
              id: initialData?.id || newRecordId.current,
              kpiData: withStoredFiscalYear(kpiScores, targetFiscalYear),
              behaviorData: behaviorScores,
              kpiScoreFinal: kpiPercentage,
              behaviorScoreFinal: behaviorPercentage,
              totalScore: finalScore,
              grade: getGrade(finalScore)
            });
          };

          const updateScore = (type, itemId, field, val) => {
            const value = parseFloat(val) || 0;
            if (type === 'kpi') {
              setKpiScores(kpiScores.map(k => k.id === itemId ? { ...k, [field]: value } : k));
            } else {
              setBehaviorScores(behaviorScores.map(b => b.id === itemId ? { ...b, [field]: value } : b));
            }
          };

          const updateKpiName = (id, newName) => {
            setKpiScores(kpiScores.map(k => k.id === id ? { ...k, name: newName } : k));
          };

          return (
            <form onSubmit={handleSubmit} className="eval-form max-w-6xl mx-auto bg-white rounded-xl shadow-md overflow-hidden pb-10">
              <div className="form-hero bg-blue-600 p-6 text-white flex justify-between items-center">
                <div>
                  <h2 className="text-2xl font-bold">ฟอร์มประเมินการปฏิบัติงาน</h2>
                  <p className="text-blue-100 mt-1">ส่วนที่ 1-4: ข้อมูล, ผลสัมฤทธิ์, พฤติกรรม และสรุป</p>
                </div>
                {isLoggedIn && (
                  <div className="score-ring" style={{ '--value': Math.min(finalScore, 100) }} role="img" aria-label={`คะแนนเฉลี่ยสุทธิ ${finalScore.toFixed(2)}%`}>
                    <div>
                      <p className="score-ring-value">{finalScore > 0 ? finalScore.toFixed(1) : '-'}</p>
                      <p className="score-ring-label">คะแนนสุทธิ</p>
                    </div>
                  </div>
                )}
              </div>

              <div className="p-8 space-y-10">
                <section>
                  <h3 className="text-lg font-bold text-gray-800 border-b pb-2 mb-4 border-gray-200 flex items-center gap-2">

                </div>
              </div>

              {/* บังคับฟอนต์ TH Sarabun PSK และขนาดข้อความปกติที่ 16pt */}
              <div className="print-report print-fit-two-pages p-8 print:p-0 text-black bg-white font-['TH_SarabunPSK','TH_Sarabun_PSK','Sarabun',sans-serif] text-[16pt] leading-[1.3]">
                <div className="report-title text-center mb-6">
                  <h1 className="text-[18pt] font-bold mb-1">ใบสรุปผลการประเมินประสิทธิภาพการปฏิบัติงาน (รวมทุกรายชื่อ)</h1>
                  <h2 className="text-[18pt] font-normal">งานอุบัติเหตุฉุกเฉินและนิติเวช</h2>
                  <h2 className="text-[18pt] font-normal">โรงพยาบาลเสลภูมิ</h2>
                  <h2 className="text-[18pt] font-normal">สังกัดสำนักงานปลัดกระทรวงสาธารณสุข</h2>
                  <p className="text-[14pt] mt-2">แยกตามรอบการประเมิน เรียงตามคะแนนรวมจากมากสุดไปน้อยสุด</p>
                  <p className="text-[14pt] mt-1">{fiscalYearLabel} / {periodLabel}</p>
                </div>

                <div className="report-summary grid grid-cols-3 gap-3 mb-4 text-center">
                  <div className="border border-black p-2">
                    <p className="font-bold">บุคลากรทั้งหมด</p>
                    <p>{filteredForPrint.length} ราย</p>
                  </div>
                  <div className="border border-black p-2">
                    <p className="font-bold">ประเมินครบแล้ว</p>
                    <p>{evaluatedEmployees.length} ราย</p>
                  </div>
                  <div className="border border-black p-2">
                    <p className="font-bold">คะแนนเฉลี่ยรวม</p>
                    <p>{formatScore(avgScore)}%</p>
                  </div>
                </div>

                {/* ตารางแยกตามรอบ จะไหลหน้ากระดาษและมีหัวตารางทุกหน้าอัตโนมัติ */}
                {employeeGroups.map(({ period, fiscalYear, items }) => (
                  <div key={`${fiscalYear || ''}-${period}`} className="mt-4">
                    <h3 className="text-[18pt] font-bold mb-1">{getGroupTitle({ period, fiscalYear })}</h3>
                    <table className="w-full border-collapse border border-black">
                      <thead>
                        <tr className="bg-gray-100 text-center font-bold">
                          <th className="border border-black p-2 w-20">ลำดับคะแนน</th>
                          <th className="border border-black p-2">ชื่อ-สกุล</th>
                          <th className="border border-black p-2">ตำแหน่ง</th>
                          <th className="border border-black p-2 w-24">ปีงบฯ</th>
                          <th className="border border-black p-2 w-32">ผลคะแนนรวม</th>
                          <th className="border border-black p-2 w-32">ระดับ/สถานะ</th>
                        </tr>
                      </thead>
                      <tbody>
                        {items.map((emp, index) => {
                          const isEvaluated = checkManagerEvaluated(emp);
                          const score = getEmployeeScore(emp);
                          let resultClass = 'text-gray-500 font-normal print:text-black';
                          if (isEvaluated) {
                            resultClass = score >= 60 ? 'text-green-600 print:text-black' : 'text-red-600 print:text-black';
                          }

                          return (
                            <tr key={emp.id}>
                              <td className="border border-black p-2 text-center font-bold">{isEvaluated ? index + 1 : '-'}</td>
                              <td className="border border-black p-2">{getEmployeeName(emp)}</td>
                              <td className="border border-black p-2">{emp.position || '-'}</td>
                              <td className="border border-black p-2 text-center">{getEmployeeFiscalYear(emp)}</td>
                              <td className="border border-black p-2 text-center font-bold">{isEvaluated ? formatScore(score) : '-'}</td>
                              <td className={`border border-black p-2 text-center font-bold ${resultClass}`}>
                                {getResultText(emp)}
                              </td>
                            </tr>
                          );
                        })}
                        {items.length === 0 && (
                          <tr>
                            <td colSpan="6" className="border border-black p-6 text-center text-gray-500">
                              ยังไม่มีข้อมูลผู้รับการประเมินในรอบนี้
                            </td>
                          </tr>
                        )}
                      </tbody>
                    </table>
                  </div>
                ))}

                {/* ลายเซ็นด้านล่าง (ป้องกันการถูกตัดแยกหน้า) */}
                <div className="signature-block mt-12 flex flex-col items-center gap-12 break-inside-avoid">
                   <div className="text-center">
                      <p className="mb-8 font-bold text-[18pt]">ผู้รายงาน</p>
                      <p className="whitespace-nowrap">( นายทวี แสนสนอง )</p>
                      <p className="mt-1 whitespace-nowrap">ตำแหน่ง หัวหน้างานการพยาบาลอุบัติเหตุฉุกเฉินและนิติเวช</p>
                      <p className="mt-1">วันที่ ......../......../..........</p>
                    </div>
                   <div className="text-center">
                      <p className="mb-8 font-bold text-[18pt]">ผู้รับรองข้อมูล</p>
                      <p className="whitespace-nowrap">( ........................................... )</p>
                      <p className="mt-1 whitespace-nowrap">ตำแหน่ง หัวหน้ากลุ่มงานการพยาบาล</p>
                      <p className="mt-1">วันที่ ......../......../..........</p>
                    </div>
                </div>
              </div>
            </div>
          );
        }

        // ==========================================
        // คอมโพเนนต์สำหรับ พิมพ์รายบุคคล (บังคับลง 1-2 หน้า)
        // ==========================================
        function PrintableView({ data, onBack }) {
          useEffect(() => {
            window.scrollTo(0, 0);
          }, []);

          if (!data) return <div className="text-center p-10">ไม่พบข้อมูล กรุณากลับไปเลือกจากแดชบอร์ด</div>;

          return (
            <div className="max-w-[210mm] mx-auto bg-white shadow-xl mb-10 print:shadow-none print:m-0">
              <div className="bg-slate-800 text-white p-4 flex justify-between items-center print:hidden rounded-t-lg">
                <button onClick={onBack} className="flex items-center gap-2 hover:text-blue-300 transition-colors">
                  <ChevronLeft className="w-5 h-5" /> กลับไปแดชบอร์ด
                </button>
                <div className="flex flex-wrap justify-end gap-2">
                  <button onClick={() => exportEvaluationToWord(data)} className="bg-blue-600 hover:bg-blue-500 px-4 py-2 rounded flex items-center gap-2 font-medium shadow-sm transition-colors">
                    <FileText className="w-5 h-5" /> ส่งออกเป็น Word
                  </button>
                  <button onClick={() => window.print()} className="bg-blue-600 hover:bg-blue-500 px-4 py-2 rounded flex items-center gap-2 font-medium shadow-sm transition-colors">
                    <Printer className="w-5 h-5" /> สั่งพิมพ์รายบุคคล (Print)
                  </button>
                </div>
              </div>

              {/* บังคับฟอนต์ TH Sarabun PSK และขนาดข้อความปกติที่ 16pt ปรับลด padding เพื่อให้ชิดกรอบพอดี 1-2 หน้า */}
              <div className="individual-print-report print-fit-two-pages p-8 print:p-0 text-black bg-white font-['TH_SarabunPSK','TH_Sarabun_PSK','Sarabun',sans-serif] text-[16pt] leading-[1.3]">
                <div className="text-center mb-4">
                  <h1 className="text-[18pt] font-bold mb-1">ใบสรุปผลการประเมินประสิทธิภาพการปฏิบัติงาน</h1>
                  <h2 className="text-[18pt] font-normal">งานอุบัติเหตุฉุกเฉินและนิติเวช</h2>
                  <h2 className="text-[18pt] font-normal">โรงพยาบาลเสลภูมิ</h2>
                  <h2 className="text-[18pt] font-normal">สังกัดสำนักงานปลัดกระทรวงสาธารณสุข</h2>
                </div>

                <div className="mb-4">
                  <h3 className="text-[18pt] font-bold mb-1">ส่วนที่ ๑ ข้อมูลของผู้รับการประเมิน</h3>
                  <div className="grid grid-cols-2 gap-y-1 gap-x-6 pl-4">
                    <div className="col-span-2">
                      <span className="font-bold">ชื่อผู้เข้ารับการประเมิน: </span> {data.employeeName || data.name}
                    </div>
                    <div>
                      <span className="font-bold">ตำแหน่ง: </span> {data.position}
                    </div>
                    <div>
                      <span className="font-bold">งาน/กลุ่มงาน: </span> {data.department}
                    </div>
                    <div>
                      <span className="font-bold">ปีงบประมาณ: </span> {getEmployeeFiscalYear(data)}
                    </div>
                    <div>
                      <span className="font-bold">รอบการประเมิน: </span> {data.period || 'ครั้งที่ 1 (1 ต.ค. - 31 มี.ค.)'}
                    </div>
                  </div>
                </div>

                {/* ส่วนที่ 4 ถูกตั้งค่า break-inside-avoid */}
                <div className="mb-4 mt-4 break-inside-avoid">
                  <h3 className="text-[18pt] font-bold mb-1">ส่วนที่ ๔ การสรุปผลการประเมินทั้งปี</h3>
                  <table className="w-full border-collapse border border-black mt-1">
                    <thead>
                      <tr className="bg-gray-100 text-center font-bold">
                        <th className="border border-black p-1">องค์ประกอบการประเมิน</th>
                        <th className="border border-black p-1 w-32">คะแนนเฉลี่ย (ก)</th>
                        <th className="border border-black p-1 w-32">น้ำหนัก (ข) %</th>
                        <th className="border border-black p-1 w-40">รวมคะแนน (ก)X(ข)</th>
                      </tr>
                    </thead>
                    <tbody>
                      <tr>
                        <td className="border border-black p-1 pl-4">ผลการประเมินด้านผลสัมฤทธิ์ของงาน</td>
                        <td className="border border-black p-1 text-center">{data.kpiScoreFinal ? data.kpiScoreFinal.toFixed(2) : '-'}</td>
                        <td className="border border-black p-1 text-center">70</td>
                        <td className="border border-black p-1 text-center font-bold">
                          {data.kpiScoreFinal ? (data.kpiScoreFinal * 0.7).toFixed(2) : '-'}
                        </td>
                      </tr>
                      <tr>
                        <td className="border border-black p-1 pl-4">ผลการประเมินด้านพฤติกรรมการปฏิบัติงาน</td>
                        <td className="border border-black p-1 text-center">{data.behaviorScoreFinal ? data.behaviorScoreFinal.toFixed(2) : '-'}</td>
                        <td className="border border-black p-1 text-center">30</td>
                        <td className="border border-black p-1 text-center font-bold">
                          {data.behaviorScoreFinal ? (data.behaviorScoreFinal * 0.3).toFixed(2) : '-'}
                        </td>
                      </tr>
                      <tr className="bg-gray-100 font-bold">
                        <td colSpan={2} className="border border-black p-1 text-right pr-4">รวมคะแนนสุทธิ</td>
                        <td className="border border-black p-1 text-center">100</td>
                        <td className="border border-black p-1 text-center text-[18pt]">{data.totalScore ? data.totalScore.toFixed(2) : '-'}</td>
                      </tr>
                    </tbody>
                  </table>
                </div>

                <div className="mb-4 border border-black p-2 text-center bg-gray-50 break-inside-avoid">
                  <p className="font-bold mb-1">ระดับผลการประเมิน</p>
                  <div className="grade-line flex justify-between items-center px-2 text-[15pt]">
                    <span className={data.grade === 'ดีเด่น' ? 'font-bold underline' : ''}>[ {data.grade === 'ดีเด่น' ? '✓' : '  '} ] ดีเด่น (90-100%)</span>
                    <span className={data.grade === 'ดีมาก' ? 'font-bold underline' : ''}>[ {data.grade === 'ดีมาก' ? '✓' : '  '} ] ดีมาก (80-89%)</span>
                    <span className={data.grade === 'ดี' ? 'font-bold underline' : ''}>[ {data.grade === 'ดี' ? '✓' : '  '} ] ดี (70-79%)</span>
                    <span className={data.grade === 'พอใช้' ? 'font-bold underline' : ''}>[ {data.grade === 'พอใช้' ? '✓' : '  '} ] พอใช้ (60-69%)</span>
                    <span className={data.grade === 'ต้องปรับปรุง' ? 'font-bold underline' : ''}>[ {data.grade === 'ต้องปรับปรุง' ? '✓' : '  '} ] ปรับปรุง ({'<'}60%)</span>
                  </div>
                </div>

                <div className="mb-6 break-inside-avoid">
                  <p className="font-bold mb-1">ความคิดเห็นเพิ่มเติมของผู้ประเมิน</p>
                  <div className="w-full border-b border-dotted border-gray-400 min-h-[1.5rem] leading-6 italic">
                    {data.comments || "ไม่มีความคิดเห็นเพิ่มเติม"}
                  </div>
                  <div className="w-full border-b border-dotted border-gray-400 mt-4"></div>
                </div>

                {/* ส่วนลายเซ็น ถูกป้องกันการตัดครึ่งเวลาพิมพ์ ถ้าที่ไม่พอมันจะปัดลงหน้า 2 ทันที */}
                <div className="individual-signatures mt-6 break-inside-avoid">
                  <h3 className="text-[18pt] font-bold mb-4">ส่วนที่ ๕ การรับทราบผลการประเมิน</h3>
                  <div className="grid grid-cols-2 gap-y-8 gap-x-8 px-4">
                    {/* 1. ผู้รับการประเมิน */}
                    <div className="text-center">
                      <p className="mb-8">ผู้รับการประเมินได้รับทราบผลการประเมินแล้ว</p>
                      <div className="border-b border-dotted border-black w-3/4 mx-auto mb-1"></div>
                      <p>( {data.employeeName || data.name} )</p>
                      <p className="">ตำแหน่ง {data.position}</p>
                      <p className="">วันที่ ......../......../..........</p>
                    </div>

                    {/* 2. ผู้ประเมิน (ผู้บังคับบัญชาชั้นต้น) */}
                    <div className="text-center">
                      <p className="mb-8">ผู้ประเมิน</p>
                      <div className="border-b border-dotted border-black w-3/4 mx-auto mb-1"></div>
                      <p>( {data.evaluatorName || '...........................................'} )</p>
                      <p className="">ตำแหน่ง ผู้บังคับบัญชาชั้นต้น</p>
                      <p className="">วันที่ ......../......../..........</p>
                    </div>
                    
                    {/* 3. หัวหน้ากลุ่มงาน */}
                    <div className="text-center">
                      <p className="mb-8">เห็นชอบผลการประเมิน</p>
                      <div className="border-b border-dotted border-black w-3/4 mx-auto mb-1"></div>
                      <p>( ........................................... )</p>
                      <p className="">ตำแหน่ง หัวหน้ากลุ่มงานการพยาบาล</p>
                      <p className="">วันที่ ......../......../..........</p>
                    </div>

                    {/* 4. ผู้อำนวยการโรงพยาบาล */}
                    <div className="text-center">
                      <p className="mb-8">เห็นชอบผลการประเมิน</p>
                      <div className="border-b border-dotted border-black w-3/4 mx-auto mb-1"></div>
                      <p>( นายบุญมี โพธิ์สนาม )</p>
                      <p className="">ตำแหน่ง ผู้อำนวยการโรงพยาบาลเสลภูมิ</p>
                      <p className="">วันที่ ......../......../..........</p>
                    </div>
                  </div>
                </div>

              </div>
            </div>
          );
        }

        // ==========================================
        // จุดเริ่มต้นการทำงาน (Render)
        // ==========================================
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<PerformanceEvaluationApp />);
    </script>
</body>
</html>
